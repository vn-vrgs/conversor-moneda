<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicación web responsive de Conversor de Monedas Nacional a partir de pesos chilenos (CLP) consultando mindicador.cl en tiempo real con gráfico histórico de Chart.js.">
    <meta name="author" content="Desarrollador Web Profesional">
    <title>Conversor de Monedas Nacional</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- FontAwesome 6 CSS CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <main class="container d-flex flex-column align-items-center justify-content-center min-vh-100 py-4">
        
        <!-- Tarjeta Principal Conversor -->
        <article class="converter-card">
            
            <!-- Encabezado de la Tarjeta -->
            <header class="app-header">
                <h1 class="app-title">Conversor de monedas Nacional</h1>
            </header>

            <!-- Formulario de Conversión -->
            <form id="converterForm" onsubmit="event.preventDefault();">
                
                <!-- Input Pesos CLP -->
                <div class="mb-4">
                    <label for="clpAmount" class="form-label-custom">Pesos CLP</label>
                    <div class="input-group-custom">
                        <i class="fas fa-dollar-sign input-icon"></i>
                        <input type="number" 
                               id="clpAmount" 
                               class="form-control-custom" 
                               placeholder="Ingrese el monto en CLP" 
                               min="1" 
                               step="any"
                               required>
                    </div>
                </div>

                <!-- Select Moneda a Convertir -->
                <div class="mb-4">
                    <label for="currencySelect" class="form-sublabel">Moneda a convertir:</label>
                    <div class="input-group-custom">
                        <i class="fas fa-coins input-icon"></i>
                        <select id="currencySelect" class="form-select-custom" required>
                            <option value="" disabled selected>Seleccione moneda</option>
                            <option value="dolar">Dólar Estadounidense (USD)</option>
                            <option value="euro">Euro (EUR)</option>
                            <option value="uf">Unidad de Fomento (UF)</option>
                            <option value="utm">Unidad Tributaria Mensual (UTM)</option>
                            <option value="bitcoin">Bitcoin (BTC)</option>
                        </select>
                    </div>
                </div>

                <!-- Botón de Acción Buscar -->
                <button type="button" id="btnSearch" class="btn-convert">
                    <i class="fas fa-search"></i>
                    <span>Buscar</span>
                </button>

            </form>

            <!-- Mensaje o Contenedor de Error (DSO / try...catch) -->
            <div id="errorBox" class="d-none"></div>

            <!-- Caja de Resultado de la Conversión -->
            <section class="result-box" aria-live="polite">
                <p id="resultText" class="result-text">...</p>
            </section>

            <!-- Sección del Gráfico Histórico 10 Días (Chart.js) -->
            <section id="chartSection" class="chart-section">
                <h2 class="chart-title">Historial últimos 10 días</h2>
                <div class="chart-wrapper">
                    <canvas id="chartCanvas"></canvas>
                </div>
            </section>

        </article>

        <!-- Footer -->
        <footer class="footer-text">
            <p>Datos en tiempo real proporcionados por <a href="https://mindicador.cl/" target="_blank" rel="noopener noreferrer">mindicador.cl</a></p>
        </footer>

    </main>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Custom JavaScript -->
    <script src="assets/js/script.js"></script>
</body>
</html>
